name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 读取 packageManager 字段，锁定仓库约定的 yarn 4.18.1
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
