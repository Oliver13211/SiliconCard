name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# statuses: write —— 终态时向 legacy commit status API 写 ci/verify 上下文：
# Actions 结果只进 check-runs 体系，若无任何 status 上下文，
# commits/{sha}/status（combined status）恒返回 pending，依赖该口径的门禁会永远判不过。
permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 读取 packageManager 字段，锁定仓库约定的 yarn 4.18.1
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      # M1-QA1 覆盖率门禁：core 的 85% 阈值（statements/branches/functions/lines）
      # 声明在 packages/core/vitest.config.ts，低于阈值即非零退出使 CI 失败。
      # 单独跑 core 覆盖（vitest --coverage 只对本包配置生效）；core 测试体量小，
      # 重复执行一次的时长可接受，换取其余包的测试仍由 yarn test 全量覆盖。
      - name: Core coverage gate (>=85%)
        run: yarn workspace @siliconcard/core test:coverage

      - name: Build
        run: yarn build

      - name: Publish commit status (legacy status API)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW: ${{ job.status }}
        run: |
          case "${RAW}" in
            success) STATE=success ;;
            failure|cancelled) STATE=failure ;;
            *) STATE=error ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="${STATE}" \
            -f context="ci/verify" \
            -f description="lint / typecheck / test / build: ${STATE}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
